include /usr/local/openresty/nginx/conf/main.d/*.conf;

user openresty;
worker_processes auto;
pid /usr/local/openresty/nginx/logs/nginx.pid;
error_log /usr/local/openresty/nginx/logs/error.log warn;

events {
    worker_connections 1024;
    # multi_accept on;
}

http {

    ################################
    ## 基本設定
    ################################
    client_body_buffer_size 10K;
    client_header_buffer_size 1k;
    client_max_body_size 8m;
    large_client_header_buffers 4 4k;

    proxy_buffer_size 8k;
    proxy_buffers 4 4k;
    proxy_busy_buffers_size 8k;
    proxy_http_version 1.1;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

    client_body_timeout 12;
    client_header_timeout 12;
    send_timeout 10;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65s 65s;
    keepalive_requests 10000;
    types_hash_max_size 2048;

    # 安全性:盡量少透露自身資訊。
    # OpenResty 已內建 headers-more,可直接使用 more_* 指令。
    server_tokens off;
    more_clear_headers 'Server';
    more_clear_headers 'X-Powered-By';

    # 防範點擊劫持
    more_set_headers 'X-Frame-Options: SAMEORIGIN';

    # 降低跨站腳本與資料注入的風險
    # https://developer.mozilla.org/en-US/docs/Web/HTTP/CSP
    more_set_headers "Content-Security-Policy: object-src 'none'; frame-ancestors 'self'; form-action 'self'; sandbox allow-forms allow-same-origin allow-scripts allow-popups allow-downloads; base-uri 'self';";

    include mime.types;
    default_type text/html;

    ################################
    ## SSL 設定
    ################################
    # 對應 Mozilla 的 intermediate 配置
    # https://ssl-config.mozilla.org/#server=nginx&config=intermediate
    ssl_session_timeout 1d;
    ssl_session_cache shared:MozSSL:10m; # 約 40000 個 session
    ssl_session_tickets off;

    ssl_protocols TLSv1.2 TLSv1.3;
    # 只保留 ECDHE。DHE 系列需要 ssl_dhparam 指向實際存在的檔案,
    # 而本套件不帶 dhparam.pem;現代環境 ECDHE 已足夠且更快。
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;

    # OCSP stapling 要啟用時,這兩行必須成對開啟,
    # 並在 server 區塊提供 ssl_trusted_certificate,否則不會生效。
    # ssl_stapling on;
    # ssl_stapling_verify on;

    ################################
    ## 日誌設定
    ################################

    log_format main escape=json '{'
    '"ip":"$remote_addr", '
    '"time":"$time_iso8601", '
    '"scheme":"$scheme", '
    '"http3":"$http3", '
    '"domain":"$server_name", '
    '"port":"$server_port", '
    '"request":"$request", '
    '"request_uri":"$request_uri", '
    '"args":"$args", '
    '"status":"$status", '
    '"sent_bytes":"$body_bytes_sent", '
    '"referer":"$http_referer", '
    '"msec":"$msec", '
    '"host":"$host", '
    '"response_time":"$request_time", '
    '"upstream_time":"$upstream_response_time", '
    '"upstream_ip":"$upstream_addr", '
    '"user-agent":"$http_user_agent", '
    '"request_body":"$request_body"'
    '}';

    access_log /usr/local/openresty/nginx/logs/access.log main;

    ################################
    ## Gzip / Brotli 設定
    ################################

    gzip on;
    gzip_disable "msie6";
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    brotli on;
    brotli_static on;

    ################################
    ## 虛擬主機設定
    ################################

    include /usr/local/openresty/nginx/conf/conf.d/*.conf;
    include /usr/local/openresty/nginx/conf/sites-enabled/*.conf;
}
