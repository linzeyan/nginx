# 靜態編譯進 nginx 的第三方模組清單。
# 行格式:<name> <git-url> <git-ref> [subdir]  (空白分隔,一行一個)
#   <git-ref> 可以是 tag、branch 或 commit SHA。
#   [subdir] 選填:模組的 config 檔不在 repo 根目錄時,指定相對路徑。
# clone 時會一併抓 submodule。
# 若模組需要事前編譯依賴(例如 brotli 要先把 deps/brotli 編成靜態庫),
# 在 scripts/module-prep/<name>.sh 放一支腳本,會在模組目錄內自動執行。
#
# 改這個檔案並 push 到 main 就會觸發重建。若 build.env 的 VERSION 沒變,
# 記得跑 make bump-release-nginx,release tag 才會是新的。
#
# brotli 只有 2021 年的 v1.0.0rc 這個 tag,對現行 nginx 太舊,
# 因此釘在 master 的 commit 上。
brotli        https://github.com/google/ngx_brotli.git                    a71f9312c2deb28875acc7bacfdd5695a111aa53
headers-more  https://github.com/openresty/headers-more-nginx-module.git  v0.40
njs           https://github.com/nginx/njs.git                            1.0.0                                     nginx
geoip2        https://github.com/leev/ngx_http_geoip2_module.git          3.4
