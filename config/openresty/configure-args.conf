# 一行一個 ./configure 參數,取字面值(不做 shell quoting 解析)。
# 空行與 '#' 開頭的行會被忽略。
# --with-openssl/--with-pcre/--with-zlib 路徑與 --add-module 由
# scripts/build-openresty.sh 自動附加,不要寫在這裡。
#
# 這份清單刻意與 config/nginx/configure-args.conf 對齊:OpenResty 的
# configure 會把所有它不認得的 --xxx 參數原封轉發給內含的 nginx
# configure,所以 nginx 能開的模組 OpenResty 都能開。唯一必要的差異是
# 路徑參數:OpenResty 有自己的 prefix 佈局(nginx 裝在 $prefix/nginx,
# 另有 luajit/lualib/bin),硬塞 --sbin-path 等參數會讓 openresty、
# resty 這些 wrapper 找不到東西。
# 另外 http_ssl 與 stream 三兄弟 OpenResty 預設就會啟用,這裡仍明寫,
# 讓兩份清單可以直接對照(重複指定不會出錯)。
--prefix=/usr/local/openresty
--user=openresty
--group=openresty
--with-compat
--with-threads
--with-file-aio
--with-pcre-jit
--with-http_ssl_module
--with-http_v2_module
--with-http_v3_module
--with-http_realip_module
--with-http_addition_module
--with-http_dav_module
--with-http_flv_module
--with-http_mp4_module
--with-http_sub_module
--with-http_gunzip_module
--with-http_gzip_static_module
--with-http_random_index_module
--with-http_stub_status_module
--with-http_auth_request_module
--with-http_secure_link_module
--with-http_slice_module
--with-stream
--with-stream_ssl_module
--with-stream_realip_module
--with-stream_ssl_preread_module
--with-mail
--with-mail_ssl_module
# 這兩個做成 dynamic module:它們必須連結 libxslt/libgd,靜態編進主
# binary 會讓 nginx 在沒裝那些函式庫的系統上直接起不來。做成 .so 後
# 只有真的 load_module 的人才需要自行安裝依賴。
--with-http_xslt_module=dynamic
--with-http_image_filter_module=dynamic
