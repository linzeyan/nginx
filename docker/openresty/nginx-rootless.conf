# rootless 變體專用設定,內容與套件版 conf/nginx.conf 一致,只改掉需要
# 特權或固定路徑的部分:不使用 user 指令,PID 與暫存路徑移到 /tmp,
# 日誌直接寫 stdout/stderr。未以 / 開頭的路徑相對於 OpenResty 的
# nginx prefix(/usr/local/openresty/nginx)解析。
include /usr/local/openresty/nginx/conf/main.d/*.conf;

worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {

    ################################
    ## 基本設定
    ################################
    client_body_buffer_size 10K;
    client_header_buffer_size 1k;
    client_max_body_size 8m;
    large_client_header_buffers 4 4k;

    proxy_buffer_size 8k;
    proxy_buffers 4 4k;
    proxy_busy_buffers_size 8k;
    proxy_http_version 1.1;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

    client_body_timeout 12;
    client_header_timeout 12;
    send_timeout 10;

    # 非特權執行:所有可寫路徑都指到 /tmp
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65s 65s;
    keepalive_requests 10000;
    types_hash_max_size 2048;

    server_tokens off;
    more_clear_headers 'Server';
    more_clear_headers 'X-Powered-By';

    more_set_headers 'X-Frame-Options: SAMEORIGIN';

    more_set_headers "Content-Security-Policy: object-src 'none'; frame-ancestors 'self'; form-action 'self'; sandbox allow-forms allow-same-origin allow-scripts allow-popups allow-downloads; base-uri 'self';";

    include mime.types;
    default_type text/html;

    ################################
    ## SSL 設定
    ################################
    ssl_session_timeout 1d;
    ssl_session_cache shared:MozSSL:10m;
    ssl_session_tickets off;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;

    ################################
    ## 日誌設定
    ################################

    log_format main escape=json '{'
    '"ip":"$remote_addr", '
    '"time":"$time_iso8601", '
    '"scheme":"$scheme", '
    '"http3":"$http3", '
    '"domain":"$server_name", '
    '"port":"$server_port", '
    '"request":"$request", '
    '"request_uri":"$request_uri", '
    '"args":"$args", '
    '"status":"$status", '
    '"sent_bytes":"$body_bytes_sent", '
    '"referer":"$http_referer", '
    '"msec":"$msec", '
    '"host":"$host", '
    '"response_time":"$request_time", '
    '"upstream_time":"$upstream_response_time", '
    '"upstream_ip":"$upstream_addr", '
    '"user-agent":"$http_user_agent", '
    '"request_body":"$request_body"'
    '}';

    access_log /dev/stdout main;

    ################################
    ## Gzip / Brotli 設定
    ################################

    gzip on;
    gzip_disable "msie6";
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    brotli on;
    brotli_static on;

    ################################
    ## 虛擬主機設定
    ################################

    include /usr/local/openresty/nginx/conf/conf.d/*.conf;
    include /usr/local/openresty/nginx/conf/sites-enabled/*.conf;
}
